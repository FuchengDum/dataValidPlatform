debug: false

server:
  port: 8080

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

spring:
  profiles:
    active: h2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  storage:
    upload-dir: data/uploads
    report-dir: data/reports
  validation:
    enable-ai-default: false
    stop-on-rule-error: false
  datasource-input:
    jdbc-readonly: true
    allow-sql-query-input: true
  ai:
    enabled: ${LOCAL_AI_ENABLED:false}
    provider: openai-compatible
    endpoint: ${LOCAL_AI_ENDPOINT:}
    api-key: ${LOCAL_AI_API_KEY:}
    model: ${LOCAL_AI_MODEL:local-model}
    timeout-seconds: ${LOCAL_AI_TIMEOUT_SECONDS:30}
